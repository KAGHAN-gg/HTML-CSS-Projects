<!DOCTYPE HTML>

<body>







<script>



var score = prompt("Enter your score:");
score = Number(score);

var grade;

if (score >= 90) {
    grade = "A";
} else if (score >= 80) {
    grade = "B";
} else if (score >= 70) {
    grade = "C";
} else if (score >= 60) {
    grade = "D";
} else {
    grade = "Failed";
}

alert(`Score: ${score}, Grade: ${grade}`);





</script>

</body>
</html>
